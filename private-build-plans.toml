[buildPlans.Wosevka]
family = "Wosevka"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.Wosevka.variants.design]
three = "flat-top-serifless"
four = "closed-serifless"
seven = "straight-serifless-crossbar"
eight = "two-circles"
capital-g = "toothed-serifless-hooked"
capital-j = "serifless"
capital-q = "vertical-crossing"
capital-x = "straight-serifless"
capital-z = "straight-serifless"
a = "double-storey-serifless"
g = "single-storey-serifless"
capital-eszet = "corner-serifless"
eszet = "traditional-serifless"
lower-delta = "flat-top"
lower-theta = "oval"
lower-lambda = "straight"
asterisk = "penta-low"
caret = "medium"
ascii-single-quote = "straight"
brace = "curly-flat-boundary"
at = "fourfold-tall"
dollar = "through"
percent = "rings-continuous-slash"
pilcrow = "high"
lig-neq = "slightly-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

[buildPlans.Wosevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Wosevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Wosevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Wosevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
